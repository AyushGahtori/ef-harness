pack: desktop
elaborations:
  - id: ELAB-Q-DSK-01-UNSIGNED-LOCAL-BUILD
    question_id: desktop.distribution
    option_id: unsigned_local_build
    summary: Unsigned local build
    touches:
      any: &a1
        - config_env
        - migration
    clauses:
      - id: ELAB-Q-DSK-01-UNSIGNED-LOCAL-BUILD.C1
        text: A developer runs a local build. There is no installer, no signature, and no auto-update.
        touches:
          any: *a1
        oracle_hint: The app runs from a local build and does not check for updates.
      - id: ELAB-Q-DSK-01-UNSIGNED-LOCAL-BUILD.C2
        text: This choice stays inside which operating systems, signing, and auto-update posture ship and
          does not grant a behavior the option does not name.
        touches:
          any: *a1
        oracle_hint: The app runs from a local build and does not check for updates.
    edge_cases:
      - If the surrounding project is not targeting this platform, desktop.distribution stays
        dormant and unsigned_local_build is not asked.
    bounds:
      - key: desktop.distribution.unsigned_local_build.bound
        value: 0
        unit: installers
    oracle_hints:
      - The app runs from a local build and does not check for updates.
      - Q-DSK-01 unsigned_local_build is observable without guessing a second platform.
