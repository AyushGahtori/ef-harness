    bounds:
      - key: mobile.offline_sync.offline_queue_versioned.bound
        value: 1
        unit: version
    oracle_hints:
      - A stale version is rejected and the user sees both copies.
      - Q-MOB-02 offline_queue_versioned is observable without guessing a second platform.
