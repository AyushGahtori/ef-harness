pack: mobile
elaborations:
  - id: ELAB-Q-MOB-01-PWA-MOBILE-WEB
    question_id: mobile.delivery
    option_id: pwa_mobile_web
    summary: PWA or mobile web
    touches:
      any: &a1
        - route
        - interactive_ui
    clauses:
      - id: ELAB-Q-MOB-01-PWA-MOBILE-WEB.C1
        text: The phone opens a web app. It can be installed as a PWA. There is no App Store binary and no
          React Native runtime.
        touches:
          any: *a1
        oracle_hint: Mobile PWA degrades cleanly offline.
      - id: ELAB-Q-MOB-01-PWA-MOBILE-WEB.C2
        text: This choice stays inside is delivery a pwa, react native or expo, or a native ios and android
          app and does not grant a behavior the option does not name.
        touches:
          any: *a1
        oracle_hint: Mobile PWA degrades cleanly offline.
    edge_cases:
      - If the surrounding project is not targeting this platform, mobile.delivery stays dormant and
        pwa_mobile_web is not asked.
    bounds:
      - key: mobile.delivery.pwa_mobile_web.bound
        value: 1
        unit: origin
    oracle_hints:
      - Mobile PWA degrades cleanly offline.
      - Q-MOB-01 pwa_mobile_web is observable without guessing a second platform.
