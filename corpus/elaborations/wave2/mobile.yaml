  - id: ELAB-Q-MOB-02-ONLINE-ONLY
    question_id: mobile.offline_sync
    option_id: online_only
    summary: Online only
    touches:
      any: &a2
        - caching
        - concurrent_edit
    clauses:
      - id: ELAB-Q-MOB-02-ONLINE-ONLY.C1
        text: Writes require a network response. Offline, the client shows a blocked state and stores
          nothing to replay.
        touches:
          any: *a2
        oracle_hint: An offline submit is rejected on the device and creates no queued write.
      - id: ELAB-Q-MOB-02-ONLINE-ONLY.C2
        text: This choice stays inside how does offline persistence resolve sync conflicts and does not
          grant a behavior the option does not name.
        touches:
          any: *a2
        oracle_hint: An offline submit is rejected on the device and creates no queued write.
    edge_cases:
      - If the surrounding project is not targeting this platform, mobile.offline_sync stays dormant
        and online_only is not asked.
    bounds:
      - key: mobile.offline_sync.online_only.bound
        value: 0
        unit: queued_writes
    oracle_hints:
      - An offline submit is rejected on the device and creates no queued write.
      - Q-MOB-02 online_only is observable without guessing a second platform.
  - id: ELAB-Q-MOB-02-OFFLINE-QUEUE-LAST-WRITE
    question_id: mobile.offline_sync
    option_id: offline_queue_last_write
    summary: Offline queue, last write wins
    touches:
      any: *a2
    clauses:
      - id: ELAB-Q-MOB-02-OFFLINE-QUEUE-LAST-WRITE.C1
        text: Writes queue locally and the latest write for a record replaces earlier queued writes on sync.
        touches:
          any: *a2
        oracle_hint: Two offline edits of one record replay as the later edit only.
      - id: ELAB-Q-MOB-02-OFFLINE-QUEUE-LAST-WRITE.C2
        text: This choice stays inside how does offline persistence resolve sync conflicts and does not
          grant a behavior the option does not name.
        touches:
          any: *a2
        oracle_hint: Two offline edits of one record replay as the later edit only.
    edge_cases:
      - If the surrounding project is not targeting this platform, mobile.offline_sync stays dormant
        and offline_queue_last_write is not asked.
    bounds:
      - key: mobile.offline_sync.offline_queue_last_write.bound
        value: 1
        unit: winner
    oracle_hints:
      - Two offline edits of one record replay as the later edit only.
      - Q-MOB-02 offline_queue_last_write is observable without guessing a second platform.
  - id: ELAB-Q-MOB-02-OFFLINE-QUEUE-VERSIONED
    question_id: mobile.offline_sync
    option_id: offline_queue_versioned
    summary: Offline queue, version check
    touches:
      any: *a2
    clauses:
      - id: ELAB-Q-MOB-02-OFFLINE-QUEUE-VERSIONED.C1
        text: Each queued write carries the version it edited. The server rejects a stale version and the
          client shows the conflict.
        touches:
          any: *a2
        oracle_hint: A stale version is rejected and the user sees both copies.
      - id: ELAB-Q-MOB-02-OFFLINE-QUEUE-VERSIONED.C2
        text: This choice stays inside how does offline persistence resolve sync conflicts and does not
          grant a behavior the option does not name.
        touches:
