        touches:
          any: *a4
        oracle_hint: A remote script URL on an extension page is refused.
      - id: ELAB-Q-EXT-04-RUNTIME-SENDMESSAGE-STRICT-CSP.C2
        text: This choice stays inside how do extension contexts message each other under csp and does not
          grant a behavior the option does not name.
        touches:
