pack: browser-extension
elaborations:
  - id: ELAB-Q-EXT-01-POPUP
    question_id: extension.surface
    option_id: popup
    summary: Toolbar popup
    touches:
      any: &a1
        - interactive_ui
        - route
    clauses:
      - id: ELAB-Q-EXT-01-POPUP.C1
        text: The action opens a small popup. The popup closes when it loses focus, and it is not a
          persistent side panel.
        touches:
          any: *a1
        oracle_hint: The toolbar action opens a popup and that popup closes on blur.
      - id: ELAB-Q-EXT-01-POPUP.C2
        text: This choice stays inside which manifest v3 surface is primary and does not grant a behavior
          the option does not name.
        touches:
          any: *a1
        oracle_hint: The toolbar action opens a popup and that popup closes on blur.
    edge_cases:
      - If the surrounding project is not targeting this platform, extension.surface stays dormant
        and popup is not asked.
    bounds:
      - key: extension.surface.popup.bound
        value: 400
        unit: px
    oracle_hints:
      - The toolbar action opens a popup and that popup closes on blur.
      - Q-EXT-01 popup is observable without guessing a second platform.
