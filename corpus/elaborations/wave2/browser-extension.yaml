  - id: ELAB-Q-EXT-03-CHROME-STORAGE-LOCAL
    question_id: extension.service_worker_state
    option_id: chrome_storage_local
    summary: chrome.storage.local
    touches:
      any: &a3
        - caching
        - config_env
    clauses:
      - id: ELAB-Q-EXT-03-CHROME-STORAGE-LOCAL.C1
        text: Durable state is written to chrome.storage.local before the worker returns. An idle unload of
          30 seconds must not drop it. The stored payload stays inside the local quota.
        touches:
          any: *a3
        oracle_hint: MV3 service worker survives 30s idle unload without losing state.
      - id: ELAB-Q-EXT-03-CHROME-STORAGE-LOCAL.C2
        text: This choice stays inside where does the service worker keep state across idle unload and does
          not grant a behavior the option does not name.
        touches:
          any: *a3
        oracle_hint: MV3 service worker survives 30s idle unload without losing state.
    edge_cases:
      - If the surrounding project is not targeting this platform, extension.service_worker_state
        stays dormant and chrome_storage_local is not asked.
    bounds:
      - key: extension.service_worker_state.chrome_storage_local.bound
        value: 30
        unit: s
    oracle_hints:
      - MV3 service worker survives 30s idle unload without losing state.
      - Q-EXT-03 chrome_storage_local is observable without guessing a second platform.
