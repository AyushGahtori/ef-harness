  - id: ELAB-Q-PAY-03-SIGNED-WEBHOOK-FULFILLMENT
    question: Q-PAY-03
    option: signed_webhook_fulfillment
    cells:
      - cell: wave1.Q-PAY-03.signed_webhook_fulfillment.behavior
        value: "The server verifies the Stripe signature and fulfills from that event, ignoring the browser return."
      - cell: wave1.Q-PAY-03.signed_webhook_fulfillment.failure
        value: "The same webhook event id arrives twice after a timeout. The ledger gains one paid order."
    edge_cases:
      - "The same webhook event id arrives twice after a timeout. The ledger gains one paid order."
    bounds:
      - "One fulfillment row per webhook event id."
    oracle_hints:
      - "Duplicate-event idempotency oracle. Replaying the same signed webhook event id fulfills the order once, and the second delivery does not create another paid order."
  - id: ELAB-Q-PAY-03-CLIENT-REDIRECT-MARKS-PAID
    question: Q-PAY-03
    option: client_redirect_marks_paid
    cells:
      - cell: wave1.Q-PAY-03.client_redirect_marks_paid.behavior
        value: "The browser return URL marks the order paid and no signed webhook is required."
      - cell: wave1.Q-PAY-03.client_redirect_marks_paid.failure
        value: "If Client redirect marks order paid without webhooks is interrupted, the effect is not applied twice."
      - cell: conflicts_with
        value: "Q-PAY-02:stripe_checkout"
      - cell: layer1_warning
        value: "browser-close / spoofed-redirect revenue loss. Require server-side signed webhook fulfillment."
    edge_cases:
      - "If Client redirect marks order paid without webhooks is interrupted, the effect is not applied twice."
    bounds:
      - "Client redirect marks order paid without webhooks allows one in-flight effect per idempotency key."
    oracle_hints:
      - "Failure oracle. Closing the browser or spoofing the redirect must not mark the order paid. Idempotency does not apply because no webhook event id exists."
