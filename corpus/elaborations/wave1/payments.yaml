title: "Wave 1 Payments elaborations"
elaborations:
  - id: ELAB-Q-PAY-01-ONE-TIME
    question: Q-PAY-01
    option: one_time
    cells:
      - cell: wave1.Q-PAY-01.one_time.behavior
        value: "The customer pays a single amount and is not enrolled in a renewal."
      - cell: wave1.Q-PAY-01.one_time.failure
        value: "If One-time charge is interrupted, the effect is not applied twice."
    edge_cases:
      - "If One-time charge is interrupted, the effect is not applied twice."
    bounds:
      - "One-time charge allows one in-flight effect per idempotency key."
    oracle_hints:
      - "Failure and idempotency oracle. Replaying the same provider event id applies the money effect once."
