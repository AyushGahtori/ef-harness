elaborations:
  - id: ELAB-Q-NTF-01-TRANSACTIONAL-EMAIL
    question: Q-NTF-01
    option: transactional_email
    cells:
      - cell: wave1.Q-NTF-01.transactional_email.behavior
        value: "Product messages go out as transactional email through Resend or SMTP, not as a marketing blast."
      - cell: wave1.Q-NTF-01.transactional_email.failure
        value: "If Transactional Email via Resend/SMTP is interrupted, the effect is not applied twice."
    edge_cases:
      - "If Transactional Email via Resend/SMTP is interrupted, the effect is not applied twice."
    bounds:
      - "Transactional Email via Resend/SMTP allows one in-flight effect per idempotency key."
    oracle_hints:
      - "Failure and idempotency oracle. A bounce retries with the same idempotency key, then dead-letters without a second user-visible send."
