  - id: ELAB-Q-DATA-01-POSTGRES
    question_id: data.storage.engine
    option_id: postgres
    summary: PostgreSQL storage contract
    touches:
      any: &a23
        - migration
    clauses:
      - id: ELAB-Q-DATA-01-POSTGRES.C1
        text: Schema changes shall run as transactional migrations.
        touches:
          any: *a23
        oracle_hint: A migration rolls back with the transaction, and a timestamptz column rejects a zone-less write.
      - id: ELAB-Q-DATA-01-POSTGRES.C2
        text: Queries shall be parameterized. Foreign keys and filter columns shall have explicit indexes. Instants shall use UTC timestamptz, and connections shall be pooled.
        touches:
          any: *a23
        oracle_hint: A migration rolls back with the transaction, and a timestamptz column rejects a zone-less write.
    edge_cases:
      - A string-concatenated query or a timestamp without a time zone fails this contract.
    bounds:
      - key: data.storage.engine.postgres.pool_required
        value: 1
        unit: count
    oracle_hints:
      - A migration rolls back with the transaction, and a timestamptz column rejects a zone-less write.
  - id: ELAB-Q-DATA-01-SQLITE
    question_id: data.storage.engine
    option_id: sqlite
    summary: Single SQLite file
    touches:
      any: &a24
        - migration
    clauses:
      - id: ELAB-Q-DATA-01-SQLITE.C1
        text: Data shall live in one local SQLite file with no separate database server.
        touches:
          any: *a24
        oracle_hint: The data file is the only store, and a second overlapping write waits or fails rather than interleaving.
      - id: ELAB-Q-DATA-01-SQLITE.C2
        text: Writes shall take one writer transaction at a time.
        touches:
          any: *a24
        oracle_hint: The data file is the only store, and a second overlapping write waits or fails rather than interleaving.
    edge_cases:
      - Two overlapping writers do not silently interleave a transaction.
    bounds:
      - key: data.storage.engine.sqlite.server_processes
        value: 0
        unit: count
    oracle_hints:
      - The data file is the only store, and a second overlapping write waits or fails rather than interleaving.
