# requires_settled privacy.activation=active. Core privacy.class=basic_contact_data does not set this flag. Regulated personal data or an explicit GDPR or company-PDF prompt does.
kind: question_pack
id: privacy-scale-obs
version: 1
title: "Privacy"
questions:
  - id: Q-PSO-01
    version: 1
    scope: project
    domains: [privacy]
    title: "How do GDPR and CCPA export and erasure work?"
    explain: "A person can export their data and be forgotten. Hard delete conflicts with a plain-text email audit log."
    criteria:
      - privacy.activation
      - privacy.erasure
    applies_when:
      - criterion: privacy.activation
        equals: active
    requires: []
    conflicts_with: []
    risk_tier: critical
    impact: critical
    reversibility: irreversible
    must_ask: true
    touches: [personal_data, destructive_write, file_download]
    options:
      - id: hard_delete
        label: "Hard delete user on GDPR request"
        meaning: "The user row and personal fields are removed immediately, with no 30-day restorable copy."
        stage_suitability: [prototype, mvp, production]
        consequences: "Hard delete user on GDPR request conflicts_with the immutable plain-text email audit. Offer an anonymized actor-ID audit trail."
      - id: soft_delete_30_day
        label: "Soft-delete with 30-day purge"
        meaning: "The account is hidden immediately and personal fields are purged after 30 days."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Soft-delete with 30-day purge means The account is hidden immediately and personal fields are purged after 30 days."
      - id: export_then_delete
        label: "Export then delete"
        meaning: "The person receives an export, then the erasure job runs."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Export then delete means The person receives an export, then the erasure job runs."
    stage_recommendations:
      prototype:
        option: soft_delete_30_day
        rationale: "Prototype still asks because this choice is irreversible. The recommended answer is Soft-delete with 30-day purge."
      mvp:
        option: soft_delete_30_day
        rationale: "MVP recommends Soft-delete with 30-day purge as the pragmatic default once this pack is active."
      production:
        option: soft_delete_30_day
        rationale: "Production recommends Soft-delete with 30-day purge so the live behavior matches the stated failure rule."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "keep them for 30 days in a soft delete, then purge, and let them download an export"
        style: spoken_dictation
        settles:
          privacy.erasure: soft_delete_30_day
      - utterance: "Use Soft-delete with 30-day purge. The account is hidden immediately and personal fields are purged after 30 days."
        style: plain
        settles:
          privacy.erasure: soft_delete_30_day
      - utterance: "The decision for this product is Soft-delete with 30-day purge."
        style: plain
        settles:
          privacy.erasure: soft_delete_30_day
      - utterance: "Settle How do GDPR and CCPA export and erasure work as Soft-delete with 30-day purge."
        style: plain
        settles:
          privacy.erasure: soft_delete_30_day
      - utterance: "I am choosing Soft-delete with 30-day purge. A person can export their data and be forgotten. Hard delete conflicts with a plain-text email audit log."
        style: plain
        settles:
          privacy.erasure: soft_delete_30_day
    negative_examples:
      - utterance: "We might do Hard delete user on GDPR request someday."
        must_not_settle: [hard_delete]
        reason: "A someday mention of Hard delete user on GDPR request does not settle privacy.erasure."
      - utterance: "Users log in."
        must_not_settle: [hard_delete]
        reason: "A login does not settle GDPR erasure."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-PSO-02
    version: 1
    scope: project
    domains: [privacy]
    title: "How immutable is the audit log, and how long is PII kept?"
    explain: "An audit trail that stores a plain email cannot coexist with hard deletion of that email. Use an actor id."
    criteria:
      - privacy.audit_log
    applies_when:
      - criterion: privacy.activation
        equals: active
    requires:
      - Q-PSO-01
    conflicts_with: []
    risk_tier: critical
    impact: critical
    reversibility: irreversible
    must_ask: true
    touches: [personal_data, logging]
    options:
      - id: immutable_plain_email
        label: "Immutable audit log storing user email in plain text"
        meaning: "The audit row stores the email in plain text and cannot be edited or purged."
        stage_suitability: [prototype, mvp, production]
        consequences: "Immutable audit log storing user email in plain text conflicts_with Hard delete user on GDPR request. Offer an anonymized actor-ID audit trail."
      - id: anonymized_actor_id
        label: "Anonymized actor-ID audit trail"
        meaning: "The audit row stores an actor id. The email can be purged without rewriting history."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Anonymized actor-ID audit trail means The audit row stores an actor id. The email can be purged without rewriting history."
    stage_recommendations:
      prototype:
        option: anonymized_actor_id
        rationale: "Prototype still asks because this choice is irreversible. The recommended answer is Anonymized actor-ID audit trail."
      mvp:
        option: anonymized_actor_id
        rationale: "MVP recommends Anonymized actor-ID audit trail as the pragmatic default once this pack is active."
      production:
        option: anonymized_actor_id
        rationale: "Production recommends Anonymized actor-ID audit trail so the live behavior matches the stated failure rule."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "log an actor id, not their email address, and don't make the log store the name forever"
        style: spoken_dictation
        settles:
          privacy.audit_log: anonymized_actor_id
      - utterance: "Use Anonymized actor-ID audit trail. The audit row stores an actor id. The email can be purged without rewriting history."
        style: plain
        settles:
          privacy.audit_log: anonymized_actor_id
      - utterance: "The decision for this product is Anonymized actor-ID audit trail."
        style: plain
        settles:
          privacy.audit_log: anonymized_actor_id
      - utterance: "Settle How immutable is the audit log, and how long is PII kept as Anonymized actor-ID audit trail."
        style: plain
        settles:
          privacy.audit_log: anonymized_actor_id
      - utterance: "I am choosing Anonymized actor-ID audit trail. An audit trail that stores a plain email cannot coexist with hard deletion of that email. Use an actor id."
        style: plain
        settles:
          privacy.audit_log: anonymized_actor_id
    negative_examples:
      - utterance: "We might do Immutable audit log storing user email in plain text someday."
        must_not_settle: [immutable_plain_email]
        reason: "A someday mention of Immutable audit log storing user email in plain text does not settle privacy.audit_log."
      - utterance: "Make it nice."
        must_not_settle: [immutable_plain_email]
        reason: "A quality wish does not settle privacy.audit_log."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
