# requires_settled ai.activation=active. A receipt upload or the phrase use on their phones does not set this flag.
kind: question_pack
id: ai-llm
version: 1
title: "AI/LLM"
questions:
  - id: Q-AI-01
    version: 1
    scope: project
    domains: [ai]
    title: "What AI task is in scope?"
    explain: "The task is extraction, classification, chat, RAG, or generation. Naming a task activates this pack."
    criteria:
      - ai.activation
      - ai.task_type
    applies_when:
      - criterion: ai.activation
        equals: active
    requires: []
    conflicts_with: []
    risk_tier: medium
    impact: medium
    reversibility: easy
    must_ask: false
    touches: [external_api, user_content, file_upload]
    options:
      - id: extraction
        label: "Extraction"
        meaning: "The model pulls structured fields from a document and does not chat."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Extraction means The model pulls structured fields from a document and does not chat."
      - id: classification
        label: "Classification"
        meaning: "The model assigns one label from a closed list."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Classification means The model assigns one label from a closed list."
      - id: ai_chat_over_pdfs
        label: "AI chat over uploaded company PDFs"
        meaning: "People chat with the model about PDFs they uploaded, and the pack's must-ask privacy and quota questions still apply."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing AI chat over uploaded company PDFs means People chat with the model about PDFs they uploaded, and the pack's must-ask privacy and quota questions still apply."
      - id: rag_over_user_pdfs
        label: "RAG over user PDFs"
        meaning: "Answers are retrieved from the user's PDFs and cited, not answered from memory alone."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing RAG over user PDFs means Answers are retrieved from the user's PDFs and cited, not answered from memory alone."
      - id: generation
        label: "Generation"
        meaning: "The model drafts new text from a prompt and is not grounded in an upload."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Generation means The model drafts new text from a prompt and is not grounded in an upload."
    stage_recommendations:
      prototype:
        option: extraction
        rationale: "Prototype recommends Extraction until a later stage needs a stricter rule."
      mvp:
        option: rag_over_user_pdfs
        rationale: "MVP recommends RAG over user PDFs as the pragmatic default once this pack is active."
      production:
        option: rag_over_user_pdfs
        rationale: "Production recommends RAG over user PDFs so the live behavior matches the stated failure rule."
    allowed_inference_rules: [infer.from_explicit_user_span, infer.from_stated_technology]
    invalidates_on_change: []
    positive_examples:
      - utterance: "it's a chat over the PDFs the company uploads, not a generic writer"
        style: spoken_dictation
        settles:
          ai.task_type: rag_over_user_pdfs
      - utterance: "Use RAG over user PDFs. Answers are retrieved from the user's PDFs and cited, not answered from memory alone."
        style: plain
        settles:
          ai.task_type: rag_over_user_pdfs
      - utterance: "The decision for this product is RAG over user PDFs."
        style: plain
        settles:
          ai.task_type: rag_over_user_pdfs
      - utterance: "Settle What AI task is in scope as RAG over user PDFs."
        style: plain
        settles:
          ai.task_type: rag_over_user_pdfs
      - utterance: "I am choosing RAG over user PDFs. The task is extraction, classification, chat, RAG, or generation. Naming a task activates this pack."
        style: plain
        settles:
          ai.task_type: rag_over_user_pdfs
    negative_examples:
      - utterance: "We might do Extraction someday."
        must_not_settle: [extraction]
        reason: "A someday mention of Extraction does not settle ai.task_type."
      - utterance: "upload a photo of the receipt"
        must_not_settle: [rag_over_user_pdfs]
        reason: "A receipt photo on an expense CLI is not an LLM task and must not settle RAG."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-AI-02
    version: 1
    scope: project
    domains: [ai]
    title: "How are grounding, citation, and hallucination handled?"
    explain: "The product either cites a source or refuses, or it allows an uncited best effort."
    criteria:
      - ai.grounding
    applies_when:
      - criterion: ai.activation
        equals: active
    requires:
      - Q-AI-01
    conflicts_with: []
    risk_tier: high
    impact: high
    reversibility: costly
    must_ask: true
    touches: [user_content, external_api]
    options:
      - id: cite_or_refuse
        label: "Cite sources or refuse"
        meaning: "An answer without a retrieved citation is refused."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Cite sources or refuse means An answer without a retrieved citation is refused."
      - id: best_effort
        label: "Best effort with hallucinations allowed"
        meaning: "The model may answer with no citation. This option is the failure case."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Best effort with hallucinations allowed means The model may answer with no citation. This option is the failure case."
    stage_recommendations:
      prototype:
        option: cite_or_refuse
        rationale: "Prototype still asks because this choice is costly. The recommended answer is Cite sources or refuse."
      mvp:
        option: cite_or_refuse
        rationale: "MVP recommends Cite sources or refuse as the pragmatic default once this pack is active."
      production:
        option: cite_or_refuse
        rationale: "Production recommends Cite sources or refuse so the live behavior matches the stated failure rule."
    allowed_inference_rules: [infer.from_explicit_user_span, infer.from_stated_technology]
    invalidates_on_change: []
    positive_examples:
      - utterance: "if it can't cite the PDF, it should say it doesn't know"
        style: spoken_dictation
        settles:
          ai.grounding: cite_or_refuse
      - utterance: "Use Cite sources or refuse. An answer without a retrieved citation is refused."
        style: plain
        settles:
          ai.grounding: cite_or_refuse
      - utterance: "The decision for this product is Cite sources or refuse."
        style: plain
        settles:
          ai.grounding: cite_or_refuse
      - utterance: "Settle How are grounding, citation, and hallucination handled as Cite sources or refuse."
        style: plain
        settles:
          ai.grounding: cite_or_refuse
      - utterance: "I am choosing Cite sources or refuse. The product either cites a source or refuses, or it allows an uncited best effort."
        style: plain
        settles:
          ai.grounding: cite_or_refuse
    negative_examples:
      - utterance: "We might do Best effort with hallucinations allowed someday."
        must_not_settle: [best_effort]
        reason: "A someday mention of Best effort with hallucinations allowed does not settle ai.grounding."
      - utterance: "Make it nice."
        must_not_settle: [best_effort]
        reason: "A quality wish does not settle ai.grounding."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-AI-03
