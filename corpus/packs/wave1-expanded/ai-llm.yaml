      - utterance: "I am choosing Block raw PII and untrusted content from the provider. Prototype still asks this. Untrusted uploads and personal data need an egress policy before any document is sent to a model provider."
        style: plain
        settles:
          ai.egress_policy: no_raw_pii_egress
    negative_examples:
