    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "give me JSON I can validate, not a stream of tokens"
        style: spoken_dictation
        settles:
          ai.output_ux: structured_json
      - utterance: "Use Structured JSON output. The model returns one schema-validated document. A partial stream is not success."
        style: plain
        settles:
          ai.output_ux: structured_json
      - utterance: "The decision for this product is Structured JSON output."
        style: plain
        settles:
          ai.output_ux: structured_json
      - utterance: "Settle Is the model output structured or streamed as Structured JSON output."
        style: plain
        settles:
          ai.output_ux: structured_json
      - utterance: "I am choosing Structured JSON output. Callers get either a structured document or a streaming text UX, not an unspecified mix."
        style: plain
        settles:
          ai.output_ux: structured_json
    negative_examples:
      - utterance: "We might do Streaming text UX someday."
        must_not_settle: [streaming_text]
        reason: "A someday mention of Streaming text UX does not settle ai.output_ux."
      - utterance: "Make it nice."
        must_not_settle: [streaming_text]
        reason: "A quality wish does not settle ai.output_ux."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
