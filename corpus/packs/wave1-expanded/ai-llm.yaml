        label: "Structured JSON output"
        meaning: "The model returns one schema-validated document. A partial stream is not success."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Structured JSON output means The model returns one schema-validated document. A partial stream is not success."
      - id: streaming_text
        label: "Streaming text UX"
        meaning: "Tokens stream to the screen and the saved answer is the completed stream."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Streaming text UX means Tokens stream to the screen and the saved answer is the completed stream."
