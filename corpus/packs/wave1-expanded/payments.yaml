# requires_settled billing.activation=active. Core integrations.external=none (no Stripe) leaves this pack dormant.
kind: question_pack
id: payments
version: 1
title: "Payments"
questions:
  - id: Q-PAY-01
    version: 1
    scope: project
    domains: [payments]
    title: "Which billing model charges the customer?"
    explain: "The billing model chooses one-time, subscription, usage credits, or a marketplace split before any charge is taken."
    criteria:
      - billing.activation
      - billing.model
    applies_when:
      - criterion: billing.activation
        equals: active
    requires: []
    conflicts_with: []
    risk_tier: high
    impact: high
    reversibility: costly
    must_ask: true
    touches: [money, external_api]
    options:
      - id: one_time
        label: "One-time charge"
        meaning: "The customer pays a single amount and is not enrolled in a renewal."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing One-time charge means The customer pays a single amount and is not enrolled in a renewal."
      - id: stripe_subscriptions
        label: "Stripe Subscriptions"
        meaning: "Stripe renews a plan on a cadence and proration rules apply at a change."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Stripe Subscriptions means Stripe renews a plan on a cadence and proration rules apply at a change."
      - id: usage_credits
        label: "Usage credits"
        meaning: "The customer draws down prepaid credits, and a zero balance stops the paid action."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Usage credits means The customer draws down prepaid credits, and a zero balance stops the paid action."
      - id: marketplace_split
        label: "Marketplace split"
        meaning: "A platform fee is split from the seller payout on each captured charge."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Marketplace split means A platform fee is split from the seller payout on each captured charge."
    stage_recommendations:
      prototype:
        option: one_time
        rationale: "Prototype still asks because this choice is costly. The recommended answer is One-time charge."
      mvp:
        option: stripe_subscriptions
        rationale: "MVP recommends Stripe Subscriptions as the pragmatic default once this pack is active."
      production:
        option: stripe_subscriptions
        rationale: "Production recommends Stripe Subscriptions so the live behavior matches the stated failure rule."
    allowed_inference_rules: [infer.from_explicit_user_span, infer.from_stated_technology]
    invalidates_on_change: []
    positive_examples:
      - utterance: "yeah charge them with Stripe Subscriptions, not a one-off and not a marketplace cut"
        style: spoken_dictation
        settles:
          billing.model: stripe_subscriptions
      - utterance: "Use Stripe Subscriptions. Stripe renews a plan on a cadence and proration rules apply at a change."
        style: plain
        settles:
          billing.model: stripe_subscriptions
      - utterance: "The decision for this product is Stripe Subscriptions."
        style: plain
        settles:
          billing.model: stripe_subscriptions
      - utterance: "Settle Which billing model charges the customer as Stripe Subscriptions."
        style: plain
        settles:
          billing.model: stripe_subscriptions
      - utterance: "I am choosing Stripe Subscriptions. The billing model chooses one-time, subscription, usage credits, or a marketplace split before any charge is taken."
        style: plain
        settles:
          billing.model: stripe_subscriptions
    negative_examples:
      - utterance: "We might do One-time charge someday."
        must_not_settle: [one_time]
        reason: "A someday mention of One-time charge does not settle billing.model."
      - utterance: "We might add payments later."
        must_not_settle: [stripe_subscriptions]
        reason: "A future maybe does not settle the billing model or unlock the payments pack."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-PAY-02
    version: 1
    scope: project
    domains: [payments]
    title: "Which processor and checkout flow takes the card?"
    explain: "Checkout is Stripe Checkout, Stripe Elements, or an invoice. A client redirect never marks the order paid."
    criteria:
      - billing.checkout_flow
    applies_when:
      - criterion: billing.activation
        equals: active
    requires:
      - Q-PAY-01
    conflicts_with: []
    risk_tier: high
    impact: high
    reversibility: costly
    must_ask: true
    touches: [money, route, external_api]
    options:
      - id: stripe_checkout
        label: "Stripe Checkout"
        meaning: "Stripe hosts the payment page and returns the customer only after Stripe accepts the attempt."
        stage_suitability: [prototype, mvp, production]
        consequences: "Stripe Checkout conflicts with Client redirect marks order paid without webhooks because of browser-close / spoofed-redirect revenue loss. Require server-side signed webhook fulfillment."
      - id: stripe_elements
        label: "Stripe Elements"
        meaning: "Card fields are embedded, and the server still confirms the PaymentIntent."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Stripe Elements means Card fields are embedded, and the server still confirms the PaymentIntent."
      - id: invoices
        label: "Invoices"
        meaning: "Stripe sends an invoice and the order stays unpaid until the invoice is paid."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Invoices means Stripe sends an invoice and the order stays unpaid until the invoice is paid."
    stage_recommendations:
      prototype:
        option: stripe_checkout
        rationale: "Prototype still asks because this choice is costly. The recommended answer is Stripe Checkout."
      mvp:
        option: stripe_checkout
        rationale: "MVP recommends Stripe Checkout as the pragmatic default once this pack is active."
      production:
        option: stripe_checkout
        rationale: "Production recommends Stripe Checkout so the live behavior matches the stated failure rule."
    allowed_inference_rules: [infer.from_explicit_user_span, infer.from_stated_technology]
    invalidates_on_change: []
    positive_examples:
      - utterance: "just send them to Stripe Checkout, don't take the card on our own page"
        style: spoken_dictation
        settles:
          billing.checkout_flow: stripe_checkout
      - utterance: "Use Stripe Checkout. Stripe hosts the payment page and returns the customer only after Stripe accepts the attempt."
        style: plain
        settles:
          billing.checkout_flow: stripe_checkout
      - utterance: "The decision for this product is Stripe Checkout."
        style: plain
        settles:
          billing.checkout_flow: stripe_checkout
      - utterance: "Settle Which processor and checkout flow takes the card as Stripe Checkout."
        style: plain
        settles:
          billing.checkout_flow: stripe_checkout
      - utterance: "I am choosing Stripe Checkout. Checkout is Stripe Checkout, Stripe Elements, or an invoice. A client redirect never marks the order paid."
        style: plain
        settles:
          billing.checkout_flow: stripe_checkout
    negative_examples:
      - utterance: "We might do Stripe Elements someday."
        must_not_settle: [stripe_elements]
        reason: "A someday mention of Stripe Elements does not settle billing.checkout_flow."
      - utterance: "Make it nice."
        must_not_settle: [stripe_elements]
        reason: "A quality wish does not settle billing.checkout_flow."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-PAY-03
    version: 1
    scope: project
    domains: [payments]
    title: "What authority marks an order paid?"
    explain: "Fulfillment trusts a signed webhook, never the browser redirect. Duplicate webhook deliveries must be idempotent."
    criteria:
      - billing.fulfillment_authority
    applies_when:
      - criterion: billing.activation
        equals: active
    requires:
      - Q-PAY-02
    conflicts_with: []
    risk_tier: critical
    impact: critical
    reversibility: irreversible
    must_ask: true
    touches: [money, inbound_webhook, credentials]
    options:
      - id: signed_webhook_fulfillment
        label: "Signed webhook fulfillment"
        meaning: "The server verifies the Stripe signature and fulfills from that event, ignoring the browser return."
        stage_suitability: [prototype, mvp, production]
        consequences: "Choosing Signed webhook fulfillment means The server verifies the Stripe signature and fulfills from that event, ignoring the browser return."
      - id: client_redirect_marks_paid
        label: "Client redirect marks order paid without webhooks"
        meaning: "The browser return URL marks the order paid and no signed webhook is required."
        stage_suitability: [prototype, mvp, production]
        consequences: "Conflict with Stripe Checkout: browser-close / spoofed-redirect revenue loss. Require server-side signed webhook fulfillment."
    stage_recommendations:
      prototype:
        option: signed_webhook_fulfillment
        rationale: "Prototype still asks because this choice is irreversible. The recommended answer is Signed webhook fulfillment."
      mvp:
        option: signed_webhook_fulfillment
        rationale: "MVP recommends Signed webhook fulfillment as the pragmatic default once this pack is active."
      production:
        option: signed_webhook_fulfillment
        rationale: "Production recommends Signed webhook fulfillment so the live behavior matches the stated failure rule."
    allowed_inference_rules: [infer.from_explicit_user_span, infer.from_stated_technology]
    invalidates_on_change: []
    positive_examples:
      - utterance: "don't trust the redirect, only the signed webhook can mark it paid"
        style: spoken_dictation
        settles:
          billing.fulfillment_authority: signed_webhook_fulfillment
      - utterance: "Use Signed webhook fulfillment. The server verifies the Stripe signature and fulfills from that event, ignoring the browser return."
        style: plain
        settles:
          billing.fulfillment_authority: signed_webhook_fulfillment
      - utterance: "The decision for this product is Signed webhook fulfillment."
        style: plain
        settles:
          billing.fulfillment_authority: signed_webhook_fulfillment
      - utterance: "Settle What authority marks an order paid as Signed webhook fulfillment."
        style: plain
        settles:
          billing.fulfillment_authority: signed_webhook_fulfillment
      - utterance: "I am choosing Signed webhook fulfillment. Fulfillment trusts a signed webhook, never the browser redirect. Duplicate webhook deliveries must be idempotent."
        style: plain
        settles:
          billing.fulfillment_authority: signed_webhook_fulfillment
    negative_examples:
      - utterance: "We might do Client redirect marks order paid without webhooks someday."
        must_not_settle: [client_redirect_marks_paid]
        reason: "A someday mention of Client redirect marks order paid without webhooks does not settle billing.fulfillment_authority."
      - utterance: "Make it nice."
        must_not_settle: [client_redirect_marks_paid]
        reason: "A quality wish does not settle billing.fulfillment_authority."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
