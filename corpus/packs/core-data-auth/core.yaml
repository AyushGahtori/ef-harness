kind: question_pack
id: core
version: 1
title: "M2 core questions"
questions:
  - id: Q-CORE-01
    version: 1
    scope: shared
    domains: [core]
    title: "Who is this for, and what job must it finish?"
    explain: "The audience and the job they hire the product to do decide every later workflow."
    criteria:
      - product.audience
      - product.purpose
    applies_when: []
    requires: []
    conflicts_with: []
    risk_tier: critical
    impact: critical
    reversibility: irreversible
    must_ask: true
    touches: [user_content]
    options:
      - id: known_group
        label: "A known group of people"
        meaning: "The same named people use it, such as one team at one workplace."
        stage_suitability: [prototype, mvp, production]
        consequences: "Accounts and roles can be created for that group."
      - id: public_customers
        label: "Anyone who shows up"
        meaning: "People you have not listed in advance can start using it."
        stage_suitability: [prototype, mvp, production]
        consequences: "Strangers need a way to arrive without a staff account."
      - id: single_operator
        label: "Just me"
        meaning: "One person runs it and nobody else has an account."
        stage_suitability: [prototype, mvp, production]
        consequences: "There is no shared login or permission split."
    stage_recommendations:
      prototype:
        option: known_group
        rationale: "A prototype serves the people already named."
      mvp:
        option: known_group
        rationale: "An MVP still serves the named group until you widen it."
      production:
        option: known_group
        rationale: "Production keeps that group until you explicitly say the audience is wider."
    allowed_inference_rules: [infer.from_explicit_user_span, infer.from_stated_audience]
    invalidates_on_change: []
    positive_examples:
      - utterance: "yeah it's for my eight coworkers so they can order lunch"
        style: spoken_dictation
        settles:
          product.audience: known_group
          product.purpose: order_lunch
      - utterance: "The morning kitchen crew uses it to place the lunch order."
        style: plain
        settles:
          product.audience: known_group
          product.purpose: order_lunch
      - utterance: "My team of twelve is the whole audience, and their job is to submit the daily order."
        style: plain
        settles:
          product.audience: known_group
          product.purpose: order_lunch
      - utterance: "Only the staff on this shift need it, and success is that lunch is ordered before the cutoff."
        style: plain
        settles:
          product.audience: known_group
          product.purpose: order_lunch
      - utterance: "It is for the people in this office so they can request a meal."
        style: plain
        settles:
          product.audience: known_group
          product.purpose: order_lunch
    negative_examples:
      - utterance: "People might look at it sometime."
        must_not_settle: [public_launch]
        reason: "A vague someday audience does not settle who the product is for."
      - utterance: "We should make it nice."
        must_not_settle: [visual_redesign]
        reason: "Wanting it to look nice does not settle the audience or the job."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-CORE-02
    version: 1
    scope: shared
    domains: [core]
    title: "What are the core workflows, and how do you know they worked?"
    explain: "The primary path and its success check are what the first build has to finish."
    criteria:
      - workflows.primary
      - workflows.success
    applies_when: []
    requires: [Q-CORE-01]
    conflicts_with: []
    risk_tier: critical
    impact: critical
    reversibility: costly
    must_ask: true
    touches: [interactive_ui]
    options:
      - id: one_main_path
        label: "One main path"
        meaning: "People finish one job from start to success, and extra chores wait."
        stage_suitability: [prototype, mvp, production]
        consequences: "The build is shaped around that single path."
      - id: several_paths
        label: "Several equal paths"
        meaning: "More than one job is required for the product to be useful."
        stage_suitability: [prototype, mvp, production]
        consequences: "Each path needs its own success check."
      - id: something_else
        label: "Something else"
        meaning: "The workflow does not match the other choices."
        stage_suitability: [prototype, mvp, production]
        consequences: "Discovery asks you to describe the path in your own words."
    stage_recommendations:
      prototype:
        option: one_main_path
        rationale: "A prototype proves one path end to end."
      mvp:
        option: one_main_path
        rationale: "An MVP can still ship the one path people named first."
      production:
        option: one_main_path
        rationale: "Production keeps one primary path until you name another that must ship too."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "so the main thing is they place the order and the kitchen sees it, that's the win"
        style: spoken_dictation
        settles:
          workflows.primary: one_main_path
          workflows.success: order_placed
      - utterance: "Staff submit an order and success is the kitchen list showing that order."
        style: plain
        settles:
          workflows.primary: one_main_path
          workflows.success: order_placed
      - utterance: "The only workflow that matters first is creating a booking and getting a confirmation."
        style: plain
        settles:
          workflows.primary: one_main_path
          workflows.success: order_placed
      - utterance: "A person files an expense and knows it worked when the total is saved."
        style: plain
        settles:
          workflows.primary: one_main_path
          workflows.success: order_placed
      - utterance: "Success is one completed checkout, not a pile of side tools."
        style: plain
        settles:
          workflows.primary: one_main_path
          workflows.success: order_placed
    negative_examples:
      - utterance: "It should also have settings."
        must_not_settle: [settings_page]
        reason: "Mentioning settings does not settle the primary workflow."
      - utterance: "Make it fast."
        must_not_settle: [performance_budget]
        reason: "Asking for speed does not say which job must succeed."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-CORE-03
    version: 1
    scope: shared
    domains: [core]
    title: "Which devices and platforms must it run on?"
    explain: "The device people actually use decides layout, install, and where the first demo runs."
    criteria:
      - delivery.platforms
    applies_when: []
    requires: [Q-CORE-01]
    conflicts_with: []
    risk_tier: high
    impact: high
    reversibility: costly
    must_ask: true
    touches: [interactive_ui, route]
    options:
      - id: web_browser
        label: "A website in a browser"
        meaning: "People open a link. There is no install."
        stage_suitability: [prototype, mvp, production]
        consequences: "The first version is a browser app."
      - id: phone_browser
        label: "A phone browser"
        meaning: "The important screen is a phone-sized browser page."
        stage_suitability: [prototype, mvp, production]
        consequences: "Layout is designed for a phone first."
      - id: installable_app
        label: "An installed app"
        meaning: "People install a native or desktop app."
        stage_suitability: [prototype, mvp, production]
        consequences: "The build includes an installable shell."
    stage_recommendations:
      prototype:
        option: web_browser
        rationale: "A prototype is easiest as a link you open in a browser."
      mvp:
        option: web_browser
        rationale: "An MVP can stay a browser app until an install is required."
      production:
        option: web_browser
        rationale: "Production stays on the browser until you require an install."
    allowed_inference_rules: [infer.from_explicit_user_span, infer.from_stated_platform]
    invalidates_on_change: []
    positive_examples:
      - utterance: "they just open the link on their phones, no app store or anything"
        style: spoken_dictation
        settles:
          delivery.platforms: phone_browser
      - utterance: "Staff use the phone browser during service."
        style: plain
        settles:
          delivery.platforms: phone_browser
      - utterance: "It has to work in mobile Safari and Chrome, not as an installed app."
        style: plain
        settles:
          delivery.platforms: phone_browser
      - utterance: "The demo is a website you pinch open on a handset."
        style: plain
        settles:
          delivery.platforms: phone_browser
      - utterance: "Desktop can wait. The phone browser is the real screen."
        style: plain
        settles:
          delivery.platforms: phone_browser
    negative_examples:
      - utterance: "use on their phones"
        must_not_settle: [offline_native_app]
        reason: "Saying people use phones does not establish an offline native app."
      - utterance: "We might do an app later."
        must_not_settle: [installable_app]
        reason: "A later maybe does not settle an installed app now."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-CORE-04
    version: 1
    scope: shared
    domains: [core]
    title: "Is this one shared space or many separate customer spaces?"
    explain: "Single-space and multi-tenant products isolate data differently, and that choice is costly to reverse."
    criteria:
      - tenancy.model
    applies_when: []
    requires: [Q-CORE-01]
    conflicts_with: []
    risk_tier: high
    impact: high
    reversibility: costly
    must_ask: true
    touches: [authz]
    options:
      - id: single_space
        label: "One shared space"
        meaning: "Everyone in the product sees the same workspace."
        stage_suitability: [prototype, mvp, production]
        consequences: "There is no per-customer data wall."
      - id: many_spaces
        label: "Many separate customer spaces"
        meaning: "Each customer has a space that others cannot see."
        stage_suitability: [prototype, mvp, production]
        consequences: "Queries and permissions must stay inside one space."
      - id: not_in_this_release
        label: "Not in this release"
        meaning: "Separate customer spaces are out of scope for now."
        stage_suitability: [prototype, mvp, production]
        consequences: "The build keeps a single space and records the deferral."
    stage_recommendations:
      prototype:
        option: single_space
        rationale: "A prototype can live in one shared space."
      mvp:
        option: single_space
        rationale: "An MVP stays one space until a second customer must be walled off."
      production:
        option: single_space
        rationale: "Production stays one space until you name real tenant boundaries."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: [auth.tenant_isolation]
    positive_examples:
      - utterance: "nah it's just our one kitchen, not a thing we sell to other restaurants"
        style: spoken_dictation
        settles:
          tenancy.model: single_space
      - utterance: "Only this company uses it, in one shared workspace."
        style: plain
        settles:
          tenancy.model: single_space
      - utterance: "There is one list of orders and every staff member is in that same space."
        style: plain
        settles:
          tenancy.model: single_space
      - utterance: "We are not hosting separate customers. It is our own tool."
        style: plain
        settles:
          tenancy.model: single_space
      - utterance: "All of the data belongs to this one team."
        style: plain
        settles:
          tenancy.model: single_space
    negative_examples:
      - utterance: "We have two shifts."
        must_not_settle: [many_spaces]
        reason: "Two shifts are not separate customer tenants."
      - utterance: "Users have profiles."
        must_not_settle: [many_spaces]
        reason: "Profiles do not by themselves mean multi-tenant isolation."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-CORE-05
    version: 1
    scope: shared
    domains: [core]
    title: "How fresh must shared information be?"
    explain: "Freshness decides whether a refresh is enough or people must see live updates."
    criteria:
      - freshness.expectation
    applies_when: []
    requires: [Q-CORE-02]
    conflicts_with: [Q-CORE-06]
    risk_tier: medium
    impact: medium
    reversibility: easy
    must_ask: false
    touches: [realtime]
    options:
      - id: refresh_on_open
        label: "Refresh when you open it"
        meaning: "People see current data when they load or refresh."
        stage_suitability: [prototype, mvp, production]
        consequences: "There is no live push channel."
      - id: live_updates
        label: "Live updates"
        meaning: "Other people's changes appear without a manual refresh."
        stage_suitability: [prototype, mvp, production]
        consequences: "The product keeps a live connection."
      - id: daily_is_enough
        label: "Daily is enough"
        meaning: "Being a day behind is acceptable."
        stage_suitability: [prototype, mvp, production]
        consequences: "A daily snapshot is enough."
    stage_recommendations:
      prototype:
        option: refresh_on_open
        rationale: "A prototype can refresh when the page opens."
      mvp:
        option: refresh_on_open
        rationale: "An MVP can keep refresh-on-open until someone needs live updates."
      production:
        option: refresh_on_open
        rationale: "Production uses refresh-on-open until a live view is required."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "they can just hit refresh, it doesn't have to move by itself"
        style: spoken_dictation
        settles:
          freshness.expectation: refresh_on_open
      - utterance: "Seeing the latest orders on reload is enough."
        style: plain
        settles:
          freshness.expectation: refresh_on_open
      - utterance: "Nobody needs a live ticker. Opening the page shows the current list."
        style: plain
        settles:
          freshness.expectation: refresh_on_open
      - utterance: "A manual refresh is the freshness we need."
        style: plain
        settles:
          freshness.expectation: refresh_on_open
      - utterance: "Data can update when the screen loads, not in the background."
        style: plain
        settles:
          freshness.expectation: refresh_on_open
    negative_examples:
      - utterance: "The kitchen is busy."
        must_not_settle: [live_updates]
        reason: "A busy room does not require live updates."
      - utterance: "use on their phones"
        must_not_settle: [live_updates]
        reason: "Phone use does not settle a live freshness requirement."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-CORE-06
    version: 1
    scope: shared
    domains: [core]
    title: "Must it keep working offline or on a poor network?"
    explain: "Offline tolerance is separate from which device people hold. Phone use does not mean an offline native app."
    criteria:
      - offline.tolerance
    applies_when: []
    requires: [Q-CORE-03]
    conflicts_with: [Q-CORE-05]
    risk_tier: medium
    impact: medium
    reversibility: easy
    must_ask: false
    touches: [caching]
    options:
      - id: online_only
        label: "Online only"
        meaning: "The product stops when the network stops."
        stage_suitability: [prototype, mvp, production]
        consequences: "There is no offline queue."
      - id: tolerate_blips
        label: "Tolerate short blips"
        meaning: "A brief network drop should not lose the current edit."
        stage_suitability: [prototype, mvp, production]
        consequences: "Unsent work is kept locally until the network returns."
      - id: full_offline
        label: "Works fully offline"
        meaning: "The main job can be finished with no network."
        stage_suitability: [prototype, mvp, production]
        consequences: "Data syncs later from the device."
    stage_recommendations:
      prototype:
        option: online_only
        rationale: "A prototype can require a network."
      mvp:
        option: online_only
        rationale: "An MVP can stay online-only until a real offline job appears."
      production:
        option: online_only
        rationale: "Production stays online-only until you require offline work."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "if the wifi is down they just wait, it doesn't need to work offline"
        style: spoken_dictation
        settles:
          offline.tolerance: online_only
      - utterance: "The app requires a connection. Offline use is out of scope."
        style: plain
        settles:
          offline.tolerance: online_only
      - utterance: "Staff only use it at the counter, where the network is up."
        style: plain
        settles:
          offline.tolerance: online_only
      - utterance: "Do not build an offline mode."
        style: plain
        settles:
          offline.tolerance: online_only
      - utterance: "A failed request should retry online, not store a local copy of the business."
        style: plain
        settles:
          offline.tolerance: online_only
    negative_examples:
      - utterance: "use on their phones"
        must_not_settle: [offline_native_app]
        reason: "Saying people use phones does not establish an offline native app."
      - utterance: "The wifi in the kitchen is usually fine."
        must_not_settle: [full_offline]
        reason: "A usually-fine network does not require full offline support."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-CORE-07
    version: 1
    scope: shared
    domains: [core]
    title: "Will people upload files or media?"
    explain: "Uploads bring size limits, file types, and a place to store bytes outside the page."
    criteria:
      - uploads.policy
    applies_when: []
    requires: [Q-CORE-02]
    conflicts_with: []
    risk_tier: medium
    impact: medium
    reversibility: easy
    must_ask: false
    touches: [file_upload]
    options:
      - id: no_uploads
        label: "No uploads"
        meaning: "People type data. They do not send files."
        stage_suitability: [prototype, mvp, production]
        consequences: "There is no upload endpoint."
      - id: images_and_docs
        label: "Images and documents"
        meaning: "People attach photos or ordinary documents."
        stage_suitability: [prototype, mvp, production]
        consequences: "Type and size limits apply, and files sit outside the public web root."
      - id: large_media
        label: "Large media"
        meaning: "People upload big video or audio."
        stage_suitability: [prototype, mvp, production]
        consequences: "The product needs a large-file store and a progress indicator."
    stage_recommendations:
      prototype:
        option: no_uploads
        rationale: "A prototype skips uploads until a workflow needs a file."
      mvp:
        option: no_uploads
        rationale: "An MVP adds uploads only when a named workflow attaches a file."
      production:
        option: no_uploads
        rationale: "Production stays without uploads until a workflow requires them."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "yeah they snap a photo of the receipt and attach it, nothing huge"
        style: spoken_dictation
        settles:
          uploads.policy: images_and_docs
      - utterance: "Users upload a PNG or PDF with the expense."
        style: plain
        settles:
          uploads.policy: images_and_docs
      - utterance: "A booking can include a photo of the room, not a video."
        style: plain
        settles:
          uploads.policy: images_and_docs
      - utterance: "Documents and images only, with a size cap."
        style: plain
        settles:
          uploads.policy: images_and_docs
      - utterance: "Staff attach a scan of the paper form."
        style: plain
        settles:
          uploads.policy: images_and_docs
    negative_examples:
      - utterance: "Put the logo on the page."
        must_not_settle: [images_and_docs]
        reason: "A built-in logo is not a user upload."
      - utterance: "We have pictures in the design."
        must_not_settle: [large_media]
        reason: "Design mockups are not a large-media upload requirement."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-CORE-08
    version: 1
    scope: shared
    domains: [core]
    title: "Does the product send email or other outbound notifications?"
    explain: "Outbound messages need a provider, a template, and a rule for who is told."
    criteria:
      - notifications.outbound
    applies_when: []
    requires: [Q-CORE-02]
    conflicts_with: []
    risk_tier: medium
    impact: medium
    reversibility: easy
    must_ask: false
    touches: [outbound_message]
    options:
      - id: none
        label: "No outbound messages"
        meaning: "The product never emails or pushes anyone."
        stage_suitability: [prototype, mvp, production]
        consequences: "There is no message provider."
      - id: email_only
        label: "Email only"
        meaning: "The product sends email and no other channel."
        stage_suitability: [prototype, mvp, production]
        consequences: "One email provider and plain templates are enough."
      - id: email_and_push
        label: "Email and push"
        meaning: "People can be told by email and by a push channel."
        stage_suitability: [prototype, mvp, production]
        consequences: "Both channels need a failure path."
    stage_recommendations:
      prototype:
        option: none
        rationale: "A prototype can show results on screen and send nothing."
      mvp:
        option: none
        rationale: "An MVP sends mail only after you name a message that must go out."
      production:
        option: none
        rationale: "Production sends nothing until a real notification is named."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "just email the totals to the shift lead, no texts or push"
        style: spoken_dictation
        settles:
          notifications.outbound: email_only
      - utterance: "Send one email when the order is placed."
        style: plain
        settles:
          notifications.outbound: email_only
      - utterance: "The only outbound channel is email."
        style: plain
        settles:
          notifications.outbound: email_only
      - utterance: "A confirmation email is required. SMS is not."
        style: plain
        settles:
          notifications.outbound: email_only
      - utterance: "Notify by email and keep the message plain."
        style: plain
        settles:
          notifications.outbound: email_only
    negative_examples:
      - utterance: "Email the totals."
        must_not_settle: [recipient_identity]
        reason: "Naming the channel does not settle who receives the mail."
      - utterance: "They talk to each other."
        must_not_settle: [email_and_push]
        reason: "People talking does not require the product to send a push."
    stage_applicability:
      prototype: true
      mvp: true
      production: true
    status: active
    eval:
      asked: 0
      changed_build_decision: 0
      user_marked_unhelpful: 0
  - id: Q-CORE-09
    version: 1
    scope: shared
    domains: [core]
    title: "Are there scheduled jobs, cutoffs, or time zones that change behavior?"
    explain: "Cutoffs and zones change what a list shows and when a job runs. Times are stored in UTC."
    criteria:
      - time.jobs_and_zones
    applies_when: []
    requires: [Q-CORE-02]
    conflicts_with: []
    risk_tier: high
    impact: high
    reversibility: costly
    must_ask: true
    touches: [scheduling, time_display]
    options:
      - id: no_clock_rules
        label: "No clock rules"
        meaning: "Nothing in the product changes because of the clock or a zone."
        stage_suitability: [prototype, mvp, production]
        consequences: "There is no scheduler and no cutoff."
      - id: one_zone_cutoffs
        label: "One zone with cutoffs"
        meaning: "Behavior changes at clock times in a single zone."
        stage_suitability: [prototype, mvp, production]
        consequences: "Jobs and cutoffs use that zone, stored as UTC instants."
      - id: many_zones
        label: "Many zones"
        meaning: "Different people see or hit cutoffs in different zones."
        stage_suitability: [prototype, mvp, production]
        consequences: "Each place needs its own zone while storage stays in UTC."
    stage_recommendations:
      prototype:
        option: one_zone_cutoffs
        rationale: "A prototype can use the one zone you are standing in."
      mvp:
        option: one_zone_cutoffs
        rationale: "An MVP keeps one zone until a second place is real."
      production:
        option: one_zone_cutoffs
        rationale: "Production keeps one zone until you operate in more than one."
    allowed_inference_rules: [infer.from_explicit_user_span]
    invalidates_on_change: []
    positive_examples:
      - utterance: "orders lock at 11 in our kitchen time, just the one timezone"
        style: spoken_dictation
        settles:
          time.jobs_and_zones: one_zone_cutoffs
      - utterance: "The cutoff is 11:00 in America/Chicago and nowhere else."
        style: plain
        settles:
          time.jobs_and_zones: one_zone_cutoffs
